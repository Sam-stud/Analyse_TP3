<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joueurs signalés – Quest Bank Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M6 3h12l4 6-10 12L2 9z' fill='%23e0b84c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="menu-navigation" class="menu-lateral">
    <div class="marque">
      <span class="marque-logo" aria-hidden="true"></span>
      <span class="marque-texte">Quest Bank<small>Console de gestion</small></span>
    </div>
    <p class="titre-menu">Navigation</p>
    <a href="index.html" class="actif lien-admin">Interface administrateur</a>
    <a href="login.html?cible=joueur.html" class="lien-joueur">Interface joueur</a>
  </aside>
  <header id="barre"></header>
  <main>
    <a class="retour" href="index.html">Tableau de bord</a>
    <div class="entete-page">
      <div>
        <h1>Joueurs signalés</h1>
        <p class="sous-titre">Examinez les signalements et bannissez les joueurs fautifs.</p>
      </div>
    </div>
    <div id="messages"></div>

    <div class="table-conteneur">
      <table id="tableau-joueurs" hidden>
        <thead>
          <tr>
            <th>Joueur</th>
            <th>Motif du signalement</th>
            <th>Date</th>
            <th>Statut</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="corps-joueurs"></tbody>
      </table>
    </div>
    <p id="liste-vide" class="vide" hidden>Aucun joueur signalé pour le moment.</p>
  </main>
  <script src="js/dataAccess.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/adminService.js"></script>
  <script src="js/pageJoueursSignales.js"></script>

</html>
