<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bogues rapportés – Quest Bank Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="menu-navigation" class="menu-lateral">
    <p class="titre-menu">Navigation</p>
    <a href="index.html" class="actif">Interface administrateur</a>
    <a href="login.html?cible=joueur.html">Interface joueur</a>
  </aside>
  <header id="barre"></header>
  <main>
    <h1>Bogues rapportés</h1>
    <div id="messages"></div>

    <p><button type="button" id="btn-rafraichir" class="secondaire">Rafraîchir la liste</button></p>

    <table id="tableau-bogues" hidden>
      <thead>
        <tr>
          <th>Titre du bogue</th>
          <th>Description du problème</th>
          <th>Joueur qui l'a signalé</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="corps-bogues"></tbody>
    </table>
    <p id="liste-vide" class="vide" hidden>Aucun bogue rapporté pour le moment.</p>
  </main>
  <script src="js/dataAccess.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/adminService.js"></script>
  <script src="js/pageBogues.js"></script>
</body>
</html>
